name: Generate GPT maps

on:
  push:
    branches: [main]
    paths:
      - 'scripts/generate_gpt_maps.py'
      - '.github/workflows/generate-gpt-maps.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Gerar mapas GPT
        run: python scripts/generate_gpt_maps.py
      - name: Indexar GLBs e validar catálogo
        run: |
          python scripts/sync_direct_glb.py
          python - <<'PY'
          import json
          from pathlib import Path
          c=json.loads(Path('catalogo.json').read_text(encoding='utf-8'))
          g=[m for m in c['models'] if m.get('author')=='gpt da resenha']
          assert len(g) >= 10, f'Esperava 10 mapas GPT, achei {len(g)}'
          assert all(Path(m['file']).exists() for m in g)
          print('Mapas GPT no catálogo:', len(g))
          PY
      - name: Publicar mapas
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/sync_direct_glb.py modelos/gpt-*.glb catalogo.json
          if git diff --cached --quiet; then
            echo 'Mapas já publicados.'
            exit 0
          fi
          git commit -m 'Adiciona 10 mapas do gpt da resenha [skip ci]'
          git push origin HEAD:main
